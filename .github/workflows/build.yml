name: Build reproducer

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes glslang-tools libvulkan-dev
      - name: Build
        run: make
      - name: Run CPU packer probe
        run: make probe
